name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run unit and architecture checks
        run: npm test
      - name: Install profiling browser
        run: npx playwright install --with-deps chromium firefox
      - name: Enforce performance budgets
        run: npm run profile
      - name: Enforce mobile performance budgets
        run: PROFILE_DEVICE=mobile npm run profile
      - name: Enforce Firefox performance budgets
        run: PROFILE_BROWSER=firefox npm run profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile
          path: |
            profile-results/
            profile-results-mobile/
            profile-results-firefox/
          if-no-files-found: ignore
          retention-days: 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
