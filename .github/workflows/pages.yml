name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run unit and architecture checks
        run: npm test
      - name: Install profiling browser
        run: npx playwright install --with-deps chromium
      # Published schema files are immutable; keep them between runs instead of
      # downloading about 5 MB per test every time; a miss is fetched from Cloudflare R2.
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - name: Check browser workflows
        run: npm run test:browser
      - name: Build cache-versioned site
        run: npm run build:site
      - name: Enforce performance budgets
        run: PROFILE_SITE_DIR=dist/site node scripts/ci_retry.mjs npm run profile
      - name: Enforce mobile performance budgets
        run: PROFILE_SITE_DIR=dist/site PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
      - name: Enforce permalink performance budgets
        run: PROFILE_SITE_DIR=dist/site PROFILE_SCENARIO=permalink node scripts/ci_retry.mjs npm run profile
      - name: Enforce mobile permalink performance budgets
        run: PROFILE_SITE_DIR=dist/site PROFILE_SCENARIO=permalink PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
      - name: Enforce mobile diagnostic switching budgets
        run: PROFILE_SITE_DIR=dist/site npm run profile:diagnostics
      - name: Enforce mobile causes and consequences budgets
        run: PROFILE_SITE_DIR=dist/site npm run profile:explore
      - name: Enforce mobile variable review and schema page budgets
        run: PROFILE_SITE_DIR=dist/site npm run profile:review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile
          path: |
            profile-results/
            profile-results-mobile/
            profile-results-permalink/
            profile-results-permalink-mobile/
            profile-results-diagnostics-mobile/
            profile-results-explore-mobile/
            profile-results-review-mobile/
          if-no-files-found: ignore
          retention-days: 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
