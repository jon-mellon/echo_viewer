name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run unit and architecture checks
        run: npm test
      # The browser download is the slowest and least predictable step; keep it between runs.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install profiling browser
        run: npx playwright install --with-deps chromium
      # Published schema files are immutable; keep them between runs instead of
      # downloading about 5 MB per test every time; a miss is fetched from Cloudflare R2.
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - name: Check browser workflows
        run: npm run test:browser
      - name: Build cache-versioned site
        run: npm run build:site
      - name: Check the default snapshot's viewer assets are published
        run: npm run check:snapshot-assets
      - uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: dist/site
          include-hidden-files: true


  performance:
    name: Performance (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: desktop
            command: node scripts/ci_retry.mjs npm run profile
          - scenario: mobile
            command: PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
          - scenario: permalink
            command: PROFILE_SCENARIO=permalink node scripts/ci_retry.mjs npm run profile
          - scenario: mobile-permalink
            command: PROFILE_SCENARIO=permalink PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
          - scenario: diagnostics
            command: npm run profile:diagnostics
          - scenario: explore
            command: npm run profile:explore
          - scenario: review
            command: npm run profile:review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - name: Run performance scenario
        env:
          PROFILE_SITE_DIR: dist/site
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile-${{ matrix.scenario }}
          path: profile-results*/
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: [validation, performance]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
