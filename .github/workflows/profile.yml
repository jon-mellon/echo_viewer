name: Profile viewer

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the default snapshot's viewer assets are published
        run: npm run check:snapshot-assets

  browser:
    name: Browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4

  performance:
    name: Performance (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: desktop
            command: node scripts/ci_retry.mjs npm run profile
          - scenario: mobile
            command: PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
          - scenario: permalink
            command: PROFILE_SCENARIO=permalink node scripts/ci_retry.mjs npm run profile
          - scenario: mobile-permalink
            command: PROFILE_SCENARIO=permalink PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
          - scenario: diagnostics
            command: npm run profile:diagnostics
          - scenario: edge-evidence
            command: npm run profile:edge-evidence
          - scenario: explore
            command: npm run profile:explore
          - scenario: review
            command: PROFILE_SITE_DIR=site npm run profile:review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - name: Run performance scenario
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile-${{ matrix.scenario }}
          path: profile-results*/
          if-no-files-found: ignore
          retention-days: 1

  # Keep the existing required check name and fail if any parallel job fails or is skipped.
  profile:
    if: always()
    needs: [checks, browser, performance]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
          PERFORMANCE: ${{ needs.performance.result }}
        run: |
          test "$CHECKS" = success && test "$BROWSER" = success && test "$PERFORMANCE" = success
