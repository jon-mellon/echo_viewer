name: Profile viewer

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  profile:
    runs-on: ubuntu-latest
    # Original baseline was 15 minutes; this runner limit is a non-performance CI timeout. The browser install alone
    # has taken from 20 seconds to 9 minutes on a busy runner, so leave room for it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # The browser download is the slowest and least predictable step; keep it between runs.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Published schema files are immutable; keep them between runs instead of
      # downloading about 5 MB per test every time; a miss is fetched from Cloudflare R2.
      - name: Restore published schema cache
        uses: actions/cache@v4
        with:
          path: .cache/published-schemas
          key: published-schemas-${{ hashFiles('site/dag_data_config.mjs', 'tests/support/published_schema_cache.cjs') }}
          restore-keys: published-schemas-
      - run: npm run test:browser
      - run: node scripts/ci_retry.mjs npm run profile
      - run: PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
      - run: PROFILE_SCENARIO=permalink node scripts/ci_retry.mjs npm run profile
      - run: PROFILE_SCENARIO=permalink PROFILE_DEVICE=mobile node scripts/ci_retry.mjs npm run profile
      - name: Check the default snapshot's viewer assets are published
        run: npm run check:snapshot-assets

      - name: Enforce mobile diagnostic switching budgets
        run: npm run profile:diagnostics
      - name: Enforce evidence loading budgets on the default snapshot
        run: npm run profile:edge-evidence
      - name: Enforce mobile causes and consequences budgets
        run: npm run profile:explore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile
          path: |
            profile-results/
            profile-results-mobile/
            profile-results-permalink/
            profile-results-permalink-mobile/
            profile-results-diagnostics-mobile/
            profile-results-edge-evidence/
            profile-results-explore-mobile/
          retention-days: 1
