name: Profile viewer

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  profile:
    runs-on: ubuntu-latest
    # Original baseline was 15 minutes; this runner limit is a non-performance CI timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run profile
      - run: PROFILE_DEVICE=mobile npm run profile
      - run: PROFILE_BROWSER=firefox npm run profile
      - run: PROFILE_SCENARIO=permalink npm run profile
      - run: PROFILE_SCENARIO=permalink PROFILE_DEVICE=mobile npm run profile
      - run: PROFILE_SCENARIO=permalink PROFILE_BROWSER=firefox npm run profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-profile
          path: |
            profile-results/
            profile-results-mobile/
            profile-results-firefox/
            profile-results-permalink/
            profile-results-permalink-mobile/
            profile-results-permalink-firefox/
          retention-days: 1
